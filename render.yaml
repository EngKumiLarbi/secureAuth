services:
  - type: web
    name: secured-auth
    runtime: docker
    plan: free
    healthCheckPath: /api/health.php
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_PEPPER
        sync: false
      - key: ADMIN_SETUP_TOKEN
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "27084"
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: SecuredAuth
